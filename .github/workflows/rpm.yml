name: RPM

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    permissions:
      contents: write # to attach RPMs to releases
    steps:
      - name: Install build dependencies
        run: >
          dnf -y install git rpm-build cargo cargo-rpm-macros gcc-c++ clang-devel
          pipewire-devel systemd-rpm-macros tar gzip xz
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0 # tags decide release vs snapshot versioning
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build source RPM
        run: packaging/make-srpm.sh dist
      - name: Build binary RPM
        run: rpmbuild --rebuild --define "_rpmdir $PWD/dist" dist/*.src.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpms
          path: dist/**/*.rpm
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.rpm
