name: RPM

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # Used by release.yml to build the RPMs for a tag.
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        required: false

concurrency:
  group: rpm-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ !startsWith(inputs.ref || github.ref, 'refs/tags/') }}

jobs:
  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: >
          dnf -y install git rpm-build cargo cargo-rpm-macros gcc-c++ clang-devel
          pipewire-devel systemd-rpm-macros tar gzip xz
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: true
          fetch-depth: 0 # tags decide release vs snapshot versioning
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build source RPM
        run: packaging/make-srpm.sh dist
      - name: Build binary RPM
        run: rpmbuild --rebuild --define "_rpmdir $PWD/dist" dist/*.src.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpms
          # The package and its source RPM; debuginfo/debugsource aren't useful to users.
          path: |
            dist/*.src.rpm
            dist/x86_64/autoframe-[0-9]*.x86_64.rpm
          if-no-files-found: error
